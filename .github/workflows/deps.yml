name: Update Go dependencies

# Run it from the Actions tab. It brings the golang.org/x modules up to date,
# checks the result with the tests and govulncheck, and commits the new
# go.mod and go.sum to main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Update modules
        run: |
          go get golang.org/x/crypto@latest golang.org/x/net@latest golang.org/x/sys@latest golang.org/x/term@latest golang.org/x/text@latest
          # the newest patch release of the Go version the modules need
          go get toolchain@latest
          go mod tidy
          git --no-pager diff --stat

      - name: Build and test
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
          go build ./...
          go test ./...

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Commit
        run: |
          if git diff --quiet go.mod go.sum; then echo "Already up to date"; exit 0; fi
          git config user.name "Jaba Macharashvili"
          git config user.email "20457439+jaba0x@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Update Go dependencies (golang.org/x/crypto $(go list -m -f '{{.Version}}' golang.org/x/crypto))"
          git push
